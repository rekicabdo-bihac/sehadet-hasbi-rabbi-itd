<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b32"><title>Pet mektebskih lekcija</title><style>*{box-sizing:border-box}body{margin:0;background:#0c2924;color:#fff6df;font:17px system-ui,-apple-system,Arial,sans-serif}header{background:linear-gradient(130deg,#145644,#10352d);padding:20px 12px;text-align:center;border-bottom:4px solid #e6c16b}h1{font-size:clamp(24px,6vw,36px);margin:0}header p{margin:6px 0}main{max-width:780px;margin:auto;padding:12px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab,.btn,.option{border:1px solid #bc9c54;border-radius:15px;background:#1c594b;color:white;padding:13px 10px;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation}.tab{font-size:14px;min-height:65px}.tab.active,.btn.gold{background:#e6c16b;color:#17362f}.panel{border:1px solid #a68a4b;border-radius:20px;padding:18px;margin-top:14px;background:#143e35}h2{margin:0 0 12px;color:#f5d581}.card{white-space:pre-line;background:#205547;padding:17px;border-radius:16px;line-height:1.7;font-size:clamp(18px,4.6vw,25px);text-align:center;font-weight:700}.meaning{background:#f6e8b9;color:#20372f;border-radius:13px;padding:15px;line-height:1.6;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.btn{flex:1}.progress{height:9px;background:#43655b;border-radius:9px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#e6c16b;transition:width .25s}.option{display:block;width:100%;margin:9px 0;text-align:left;font-weight:550;background:#225648;min-height:52px}.option.correct{background:#176d44}.option.wrong{background:#8e3535}.status{min-height:30px;font-weight:700}.muted{color:#d9ddcd;font-size:14px}.score{font-size:20px;color:#f3d274}footer{text-align:center;padding:22px}.hide{display:none}@media(max-width:380px){.tab{font-size:13px;padding:8px}.panel{padding:12px}}</style></head><body><header><h1>📚 PET MEKTEBSKIH LEKCIJA</h1><p>Nauči • Vježbaj • Provjeri znanje</p><small>Pripremio Abdo ef. Rekić</small></header><main><nav id="tabs" class="tabs"></nav><section class="panel" id="lesson"></section></main><footer>Svaka lekcija ima svoj završni kviz od 15 pitanja. 🔊</footer><script>const lessons=[["Naša vjera – islam", "Naša vjera je islam. Mi smo muslimani i muslimanke. Vjerujemo u Allaha i poslanika Muhammeda, govorimo istinu i radimo dobra djela.", "Islam je naša vjera; učimo da volimo druge, govorimo istinu i činimo dobra djela.", [["Kako se zove naša vjera?", "Islam", ["Iman", "Ihsan", "Šehadet"]], ["Kako se zovu pripadnici islama?", "Muslimani i muslimanke", ["Učenici i učenice", "Muallimi i muallime", "Dječaci i djevojčice"]], ["Šta govorimo prema lekciji?", "Istinu", ["Neistinu", "Ružne riječi", "Uvredljive riječi"]], ["Kakva djela radimo?", "Dobra djela", ["Loša djela", "Štetna djela", "Nepravedna djela"]], ["Šta islam uči o drugima?", "Da ih volimo", ["Da ih vrijeđamo", "Da im nanosimo štetu", "Da ih ismijavamo"]], ["Šta je islam za nas?", "Naša vjera", ["Naziv dove", "Naziv pozdrava", "Naziv ilahije"]], ["Kako se ponaša onaj ko govori istinu?", "Iskreno", ["Neiskreno", "Dvolično", "Lažno"]], ["Koja je rečenica iz lekcije tačna?", "Naša vjera je islam.", ["Naša vjera je selam.", "Naša vjera je šehadet.", "Naša vjera je ilahija."]], ["Šta se očekuje od muslimana prema lekciji?", "Da čini dobra djela", ["Da čini loša djela", "Da zanemaruje dobro", "Da čini nepravdu"]]]], ["Kelimei-šehadet", "EŠHEDU EN LĀ ILĀHE ILLALLĀH, VE EŠHEDU ENNE MUHAMMEDEN ABDUHŪ VE RESŪLUHŪ.", "Vjerujem i izjavljujem da je samo Allah Bog, i vjerujem i izjavljujem da je Muhammed Allahov rob i poslanik.", [["Kako potvrđujemo pripadnost islamu?", "Izgovaranjem kelimei-šehadeta", ["Izgovaranjem selama", "Učenjem ilahije Hasbi Rabbi", "Učenjem dove Rabbi jessir"]], ["Kako počinje kelimei-šehadet?", "Ešhedu en lā ilāhe illallāh", ["Ve ešhedu enne Muhammeden", "Ve alejkumus-selam", "Hasbi Rabbi džellallah"]], ["Šta znači „lā ilāhe illallāh“?", "Nema drugog Boga osim Allaha", ["Muhammed je moj poslanik", "Kur’an je moja vjera", "Selam je moj pozdrav"]], ["Ko se spominje u drugom dijelu šehadeta?", "Muhammed, alejhis-selam", ["Adem, alejhis-selam", "Ibrahim, alejhis-selam", "Nuh, alejhis-selam"]], ["Šta potvrđujemo prvim dijelom šehadeta?", "Da je samo Allah Bog", ["Da je Muhammed Allahov rob I poslanik", "Da je Kur’an naš kitab", "Da je islam naša vjera"]], ["Šta potvrđujemo drugim dijelom šehadeta?", "Da je Muhammed Allahov rob i poslanik", ["Da je samo Allah bog", "Da je Kuran naša knjiga", "Da je Islam naša vjera"]], ["Koje riječi slijede nakon „ve ešhedu enne“?", "Muhammeden abduhū ve resūluhū", ["Lā ilāhe illallāh", "Es-selamu alejkum", "Rabbi zidnī ilmā"]], ["Kako se zove izjava pripadnosti islamu?", "Kelimei-šehadet", ["Kelimei-selam", "Kelimei-ilahija", "Kelimei-dova"]], ["Šta znači riječ „ešhedu“ u prijevodu lekcije?", "Vjerujem i izjavljujem", ["Pozdravljam i odlazim", "Čitam i pišem", "Pitam i odgovaram"]], ["Koji izraz pripada kelimei-šehadetu?", "Ve resūluhū", ["Ve rahmetullahi", "Ve berekatuhu", "Rabbi jessir"]], ["Šta u šehadetu znači „abduhū“?", "Njegov rob", ["Njegova knjiga", "Njegov melek", "Njegov poslanik"]], ["Koju poruku nosi kelimei-šehadet?", "Vjerovanje u Allaha i Njegovog poslanika", ["Pravila oblačenja", "Redoslijed jela", "Vrijeme spavanja"]], ["Šta je šehadet prema lekciji?", "Potvrda pripadnosti islamu", ["Naziv pet dnevnih namaza", "Naziv islamskog pozdrava", "Naziv ilahije"]]]], ["Islamski pozdrav – selam", "ES-SELAMU ALEJKUM! — VE ALEJKUMUS-SELAM!", "Selam je pozdrav mira. Lijepo je dodati „ve rahmetullahi ve berekatuhu“. Selam nazivamo roditeljima, rodbini, prijateljima i poznanicima muslimanima, pri ulasku i izlasku iz kuće te pri dolasku i odlasku iz društva.", [["Kako glasi islamski pozdrav?", "Es-selamu alejkum", ["Ve alejkumus-selam", "Rabbi zidni ilma", "Hasbi Rabbi"]], ["Kako odgovaramo na selam?", "Ve alejkumus-selam", ["Es-selamu alejkum", "Rabbi jessir", "Ešhedu en lā ilāhe"]], ["Šta znači selam?", "Neka je na vas Allahov mir i blagoslov", ["Neka vam dan bude dug", "Neka vam put bude kratak", "Neka vam posao bude lak"]], ["Šta je lijepo dodati selamu?", "Ve rahmetullahi ve berekatuhu", ["Rabbi jessir ve la tuassir", "Ve Muhammedun nebijji", "Ve-l-Kur’anu kitabi"]], ["Kome nazivamo selam?", "Roditeljima, rodbini i prijateljima muslimanima", ["Samo nepoznatim ljudima", "Samo učiteljima", "Samo odraslima"]], ["Kada nazivamo selam pri dolasku kući?", "Pri ulasku u kuću", ["Samo pred spavanje", "Samo za vrijeme ručka", "Samo ujutro"]], ["Kada još nazivamo selam u kući?", "Pri izlasku iz kuće", ["Samo pri ustajanju", "Samo pri pranju ruku", "Samo pri čitanju"]], ["Kako se pozdravljamo pri dolasku u društvo?", "Nazovemo selam", ["Izgovorimo šehadet umjesto pozdrava", "Učimo Hasbi Rabbi umjesto pozdrava", "Ne pozdravimo nikoga"]], ["Šta radimo pri odlasku iz društva?", "Nazovemo selam", ["Odlazimo bez pozdrava", "Zamijenimo pozdrav dovom za znanje", "Zamijenimo pozdrav ilahijom"]], ["Koji izraz znači odgovor na selam?", "Ve alejkumus-selam", ["Es-selamu alejkum", "Hasbi Rabbi", "Lā ilāhe illallāh"]], ["Šta izražavamo selamom?", "Želju za mirom", ["Želju za svađom", "Želju za uvredom", "Želju za neprijateljstvom"]], ["Koji dodatak spominje Allahovu milost i blagoslov?", "Ve rahmetullahi ve berekatuhu", ["Ve alejkumus-selam", "Es-selamu alejkum", "Rabbi zidni ilma"]], ["Šta se radi kad nam neko nazove selam?", "Odgovorimo na selam", ["Šutimo namjerno", "Odgovorimo ilahijom", "Odgovorimo nazivom namaza"]], ["Koji par je pravilno napisan?", "Es-selamu alejkum — Ve alejkumus-selam", ["Es-selamu alejkum — Rabbi jessir", "Hasbi Rabbi — Ve alejkumus-selam", "Rabbi zidni ilma — Es-selamu alejkum"]]]], ["Muhammed, alejhis-selam, naš poslanik", "Muhammed, alejhis-selam, posljednji je Allahov poslanik. Rođen je u Mekki 12. rebiul-evvela 571. godine. Otac mu je bio Abdullah, a majka Amina. Kao dijete ostao je bez roditelja. Odrastao je kod djeda Abdulmuttaliba i amidže Ebu Taliba. U četrdesetoj godini života počela mu je objava časnog Kur’ana.", "Kada spomenemo ime Muhammeda, kažemo „alejhis-selam“ (a.s.) – neka je na njega Allahov mir. On nam je uzor u ponašanju.", [["Ko je posljednji Allahov poslanik?", "Muhammed, alejhis-selam", ["Adem, alejhis-selam", "Nuh, alejhis-selam", "Ibrahim, alejhis-selam"]], ["Gdje je rođen Muhammed, alejhis-selam?", "U Mekki", ["U Medini", "U Jerusalemu", "U Taifu"]], ["Kada je rođen prema lekciji?", "12. rebiul-evvela 571. godine", ["12. rebiul-evvela 622. godine", "1. muharrema 571. godine", "27. ramazana 571. godine"]], ["Kako se zvao njegov otac?", "Abdullah", ["Abdulmuttalib", "Ebu Talib", "Hamza"]], ["Kako se zvala njegova majka?", "Amina", ["Hatidža", "Fatima", "Aiša"]], ["Šta se dogodilo u njegovom djetinjstvu?", "Ostao je bez roditelja", ["Ostao je bez učitelja", "Ostao je bez prijatelja", "Ostao je bez kuće"]], ["Kako se zvao njegov djed?", "Abdulmuttalib", ["Abdullah", "Ebu Talib", "Bilal"]], ["Kako se zvao njegov amidža spomenut u lekciji?", "Ebu Talib", ["Abdullah", "Abdulmuttalib", "Omer"]], ["U kojoj godini života mu je počela objava?", "U četrdesetoj", ["U tridesetoj", "U pedesetoj", "U dvadesetoj"]], ["Šta mu je Allah počeo objavljivati?", "Kur’an", ["Tevrat", "Indžil", "Zebur"]], ["Šta kažemo kad spomenemo njegovo ime?", "Alejhis-selam", ["Ve alejkumus-selam", "Rabbi jessir", "Hasbi Rabbi"]], ["Šta znači „alejhis-selam“ prema lekciji?", "Neka je na njega Allahov mir", ["Neka mu je dug put", "Neka mu je lahak posao", "Neka mu je lijep dan"]], ["U čemu nam je Muhammed, alejhis-selam, uzor?", "U ponašanju", ["U nepravdi", "U ružnim riječima", "U svađi"]], ["Ko je brinuo o njemu nakon roditelja prema lekciji?", "Djed i amidža", ["Samo prijatelji", "Samo komšije", "Samo učitelji"]], ["Koja je tačna tvrdnja?", "Muhammed, alejhis-selam, posljednji je Allahov poslanik", ["Muhammed, alejhis-selam, rodjen u Medini", "Muhammed, alejhis-selam, umro u Mekki", "Muhammed, alejhis-selam, objavljen  mu je  Tevrat"]]]], ["Hasbi Rabbi", "HASBI RABBI DŽELLALLAH\nMA FI KALBI GAJRULLAH\nNUR MUHAMMED SALLALLAH\nLA ILAHE ILLALLAH", "Meni je dovoljan Uzvišeni Allah. U mom srcu je samo Allah. Bog je jedan, samo Allah. Moje svjetlo je Muhammed. La ilahe illallah. Musliman se oslanja samo na Allaha, dželle šanuhu, vjeruje u Njega, izvršava Njegove naredbe i kloni se Njegovih zabrana.", [["Kako počinje ilahija Hasbi Rabbi?", "Hasbi Rabbi džellallah", ["Ma fi kalbi gajrullah", "Nur Muhammed sallallah", "La ilahe illallah"]], ["Koji je drugi stih ilahije?", "Ma fi kalbi gajrullah", ["Hasbi Rabbi džellallah", "Nur Muhammed sallallah", "La ilahe illallah"]], ["Koji je treći stih ilahije?", "Nur Muhammed sallallah", ["Ma fi kalbi gajrullah", "Hasbi Rabbi džellallah", "La ilahe illallah"]], ["Koji je četvrti stih ilahije?", "La ilahe illallah", ["Hasbi Rabbi džellallah", "Ma fi kalbi gajrullah", "Nur Muhammed sallallah"]], ["Šta znači „Hasbi Rabbi“ prema prijevodu?", "Meni je dovoljan Uzvišeni Allah", ["U mom srcu je samo Allah", "Moje svjetlo je Muhammed", "Bog je jedan, samo Allah"]], ["Šta znači „Ma fi kalbi gajrullah“?", "U mom srcu je samo Allah", ["Meni je dovoljan Uzvišeni Allah", "Moje svjetlo je Muhammed", "Bog je jedan, samo Allah"]], ["Šta znači „Nur Muhammed sallallah“ prema lekciji?", "Moje svjetlo je Muhammed", ["U mom srcu je samo Allah", "Meni je dovoljan Uzvišeni Allah", "Bog je jedan, samo Allah"]], ["Šta znači „La ilahe illallah“?", "Nema drugog Boga osim Allaha", ["Muhammed je moj poslanik", "Kur’an je moja knjiga", "Selam je moja vjera"]], ["Šta musliman izvršava?", "Allahove naredbe", ["Allahove zabrane", "Ružna djela", "Nepravdu"]], ["Čega se musliman kloni?", "Allahovih zabrana", ["Dobrih djela", "Istine", "Lijepog ponašanja"]], ["Ko je svjetlo u našim srcima prema ilahiji?", "Muhammed, alejhis-selam", ["Neki vladar", "Neki pjesnik", "Neki putnik"]], ["Koji stih dolazi poslije „Ma fi kalbi gajrullah“?", "Nur Muhammed sallallah", ["Hasbi Rabbi džellallah", "La ilahe illallah", "Ma fi kalbi gajrullah"]]]]];let current=0,order=[],idx=0,points=0,locked=false,mode='learn',timer=null;let audio;function beep(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?620:220,audio.currentTime);o.frequency.exponentialRampToValueAtTime(ok?900:150,audio.currentTime+.18);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.24);o.start();o.stop(audio.currentTime+.25)}catch(e){}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setLesson(i){clearTimeout(timer);current=i;mode='learn';document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('active',i===j));showLearn()}function showLearn(){const l=lessons[current];document.getElementById('lesson').innerHTML=`<h2>📖 ${escapeHtml(l[0])}</h2><div class="card">${escapeHtml(l[1])}</div><div class="meaning">${escapeHtml(l[2])}</div><div class="actions"><button class="btn gold" onclick="startQuiz()">🎯 ZAVRŠNI KVIZ — 15 PITANJA</button></div><p class="muted">Izaberi kviz kada proučiš tekst. Svaka lekcija ima svoj zaseban rezultat.</p>`}function startQuiz(){clearTimeout(timer);mode='quiz';order=shuffle(lessons[current][3]);idx=0;points=0;locked=false;showQuestion()}function showQuestion(){locked=false;if(idx>=order.length){mode='done';document.getElementById('lesson').innerHTML=`<h2>🏆 Završetak kviza</h2><div class="meaning">Završio/la si svih 15 pitanja iz lekcije <b>${escapeHtml(lessons[current][0])}</b>.<br><span class="score">Bodovi: ${points}</span></div><div class="actions"><button class="btn gold" onclick="startQuiz()">🔄 Ponovi kviz</button><button class="btn" onclick="showLearn()">📖 Vrati se na lekciju</button></div>`;return}const q=order[idx],opts=shuffle([q[1],...q[2]]);document.getElementById('lesson').innerHTML=`<h2>🎯 ${escapeHtml(lessons[current][0])}</h2><div class="score">Pitanje ${idx+1} / 15 · Bodovi: ${points}</div><div class="progress"><div style="width:${idx/15*100}%"></div></div><h3>${escapeHtml(q[0])}</h3><div id="answers">${opts.map((o,j)=>`<button class="option" data-answer="${j}" onclick="answer(${j})">${escapeHtml(o)}</button>`).join('')}</div><div id="status" class="status" aria-live="polite"></div><p class="muted">Tačno +10 · Netačno −3 · Sljedeće pitanje dolazi automatski.</p>`;window.activeOpts=opts}function answer(n){if(locked)return;locked=true;const correct=order[idx][1],chosen=window.activeOpts[n],ok=chosen===correct;points+=ok?10:-3;beep(ok);document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(window.activeOpts[j]===correct)b.classList.add('correct');else if(j===n)b.classList.add('wrong')});document.getElementById('status').textContent=ok?'✅ Tačno!':'❌ Netačno. Tačan odgovor: '+correct;timer=setTimeout(()=>{idx++;showQuestion()},1150)}document.getElementById('tabs').innerHTML=lessons.map((l,i)=>`<button class="tab" onclick="setLesson(${i})">${i+1}. ${escapeHtml(l[0])}</button>`).join('');setLesson(0);</script></body></html>
